apiVersion: apps/v1
kind: Deployment

metadata:
  name: mini-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mini-devops-app

  template:
    metadata:
      labels:
        app: mini-devops-app

    spec:
      containers:
        - name: mini-devops-app
          image: naumanfazal5/mini-devops-app:v1

          ports:
            - containerPort: 3000